<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중화 반응 데이터 분석 및 그래프 생성기</title>
    <!-- Chart.js 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #2b579a;
            --accent-color: #e67e22;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 12px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 16px 0 8px 0;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.25rem;
            color: var(--primary-color);
            margin: 0 0 6px 0;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #666;
            margin: 0;
        }

        .alert-box {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .alert-box strong {
            color: #856404;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        button {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-example {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-example:hover {
            background-color: #1b365d;
        }

        .btn-reset {
            background-color: #e0e0e0;
            color: #444;
        }

        .btn-reset:hover {
            background-color: #d0d0d0;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.85rem;
        }

        th, td {
            padding: 8px 6px;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        th {
            background-color: #f8f9fa;
            color: #444;
            font-weight: 600;
            white-space: nowrap;
        }

        /* 12~18 mL 정밀 구간 하이라이트 */
        .highlight-row {
            background-color: #fff8e7;
        }

        .highlight-row td:first-child {
            font-weight: bold;
            color: #d9534f;
        }

        input[type="number"], select {
            width: 90%;
            padding: 6px 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
            font-size: 0.85rem;
            box-sizing: border-box;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 4px rgba(43,87,154,0.3);
        }

        .chart-container {
            position: relative;
            height: 280px;
            width: 100%;
            margin-top: 10px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🧪 반응 온도 및 색변화 데이터 분석기</h1>
        <p class="subtitle">묽은 염산 15 mL + 묽은 수산화 나트륨 수용액 반응</p>
    </header>

    <div class="alert-box">
        ⚠️ <strong>실험 주의사항:</strong> <br>
        • <strong>12.0 ~ 18.0 mL 구간</strong>은 반응이 급격하게 진행되므로 <strong>1 mL 단위(방울 단위)</strong>로 천천히 투여하며 정밀하게 측정하세요!
    </div>

    <div class="card">
        <div class="btn-group">
            <button class="btn-example" onclick="loadExampleData()">💡 예시 데이터 채우기</button>
            <button class="btn-reset" onclick="resetData()">🧹 데이터 초기화</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 25%;">NaOH 투여량<br>(mL)</th>
                        <th style="width: 35%;">혼합 용액 온도<br>(°C)</th>
                        <th style="width: 40%;">지시약 색상</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <!-- 스크립트로 동적 생성됨 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 온도 변화 그래프 카드 -->
    <div class="card">
        <div class="section-title">📊 1. 혼합 용액 온도 변화 그래프</div>
        <div class="chart-container">
            <canvas id="tempChart"></canvas>
        </div>
    </div>

    <!-- 지시약 색변화 그래프 카드 -->
    <div class="card">
        <div class="section-title">🎨 2. 지시약 색상 변화 그래프</div>
        <div class="chart-container">
            <canvas id="colorChart"></canvas>
        </div>
    </div>
</div>

<script>
    // 투여량 데이터 세트 (12~18mL 구간은 1mL 단위 정밀 구간)
    const volumes = [0.0, 3.0, 6.0, 9.0, 12.0, 13.0, 14.0, 15.0, 16.0, 17.0, 18.0, 21.0, 24.0, 27.0];

    // 예시 데이터 (산성 환경: 붉은색계열 시작 반영)
    const exampleTemps = [20.0, 21.8, 23.5, 25.2, 27.0, 27.8, 28.5, 29.2, 28.7, 28.1, 27.4, 25.6, 24.0, 22.8];
    const exampleColors = ["red", "red", "red", "orange", "orange", "orange", "yellow", "green", "blue", "blue", "blue", "purple", "purple", "purple"];

    // 색상명 및 헥사코드 매핑
    const colorMap = {
        "red": { name: "붉은색", code: "#e74c3c", value: 1 },
        "orange": { name: "주황색", code: "#e67e22", value: 2 },
        "yellow": { name: "노란색", code: "#f1c40f", value: 3 },
        "green": { name: "초록색", code: "#2ecc71", value: 4 },
        "blue": { name: "파란색", code: "#3498db", value: 5 },
        "purple": { name: "보라색", code: "#9b59b6", value: 6 }
    };

    let tempChartInstance = null;
    let colorChartInstance = null;

    // 테이블 행 초기화 생성
    function initTable() {
        const tbody = document.getElementById('dataTableBody');
        tbody.innerHTML = '';

        volumes.forEach((vol, idx) => {
            const tr = document.createElement('tr');
            
            // 12~18 mL 구간 강조 스타일링
            const isHighlight = vol >= 12.0 && vol <= 18.0;
            if (isHighlight) {
                tr.classList.add('highlight-row');
            }

            const volText = vol.toFixed(1) + (isHighlight ? ' ★' : '');
            
            tr.innerHTML = `
                <td>${volText}</td>
                <td>
                    <input type="number" step="0.1" id="temp-${idx}" placeholder="예: 25.0" oninput="updateCharts()">
                </td>
                <td>
                    <select id="color-${idx}" onchange="updateCharts()">
                        <option value="">선택</option>
                        <option value="red">붉은색 (산성)</option>
                        <option value="orange">주황색</option>
                        <option value="yellow">노란색</option>
                        <option value="green">초록색 (중성)</option>
                        <option value="blue">파란색 (염기성)</option>
                        <option value="purple">보라색</option>
                    </select>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 예시 데이터 채우기
    function loadExampleData() {
        volumes.forEach((vol, idx) => {
            document.getElementById(`temp-${idx}`).value = exampleTemps[idx];
            document.getElementById(`color-${idx}`).value = exampleColors[idx];
        });
        updateCharts();
    }

    // 데이터 초기화
    function resetData() {
        volumes.forEach((vol, idx) => {
            document.getElementById(`temp-${idx}`).value = '';
            document.getElementById(`color-${idx}`).value = '';
        });
        updateCharts();
    }

    // 그래프 업데이트 함수
    function updateCharts() {
        const tempDataPoints = [];
        const colorDataPoints = [];
        const pointBackgroundColors = [];

        volumes.forEach((vol, idx) => {
            const tempVal = parseFloat(document.getElementById(`temp-${idx}`).value);
            const colorVal = document.getElementById(`color-${idx}`).value;

            if (!isNaN(tempVal)) {
                tempDataPoints.push({ x: vol, y: tempVal });
            }

            if (colorVal && colorMap[colorVal]) {
                colorDataPoints.push({ x: vol, y: colorMap[colorVal].value });
                pointBackgroundColors.push(colorMap[colorVal].code);
            }
        });

        // 1. 온도 변화 그래프 (Linear X-Axis 적용)
        if (tempChartInstance) tempChartInstance.destroy();
        const ctxTemp = document.getElementById('tempChart').getContext('2d');
        tempChartInstance = new Chart(ctxTemp, {
            type: 'line',
            data: {
                datasets: [{
                    label: '혼합 용액 온도 (°C)',
                    data: tempDataPoints,
                    borderColor: '#2b579a',
                    backgroundColor: 'rgba(43, 87, 154, 0.1)',
                    borderWidth: 2.5,
                    pointRadius: 4,
                    pointHoverRadius: 6,
                    tension: 0.2,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom',
                        title: { display: true, text: 'NaOH 투여량 (mL)', font: { size: 12, weight: 'bold' } },
                        min: 0,
                        max: 27,
                        ticks: { stepSize: 3 }
                    },
                    y: {
                        title: { display: true, text: '온도 (°C)', font: { size: 12, weight: 'bold' } },
                        suggestedMin: 15,
                        suggestedMax: 35
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });

        // 2. 지시약 색상 변화 그래프
        if (colorChartInstance) colorChartInstance.destroy();
        const ctxColor = document.getElementById('colorChart').getContext('2d');
        colorChartInstance = new Chart(ctxColor, {
            type: 'line',
            data: {
                datasets: [{
                    label: '지시약 색상 단계',
                    data: colorDataPoints,
                    borderColor: '#7f8c8d',
                    borderWidth: 2,
                    pointRadius: 6,
                    pointBackgroundColor: pointBackgroundColors,
                    pointBorderColor: '#fff',
                    pointBorderWidth: 1.5,
                    stepped: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom',
                        title: { display: true, text: 'NaOH 투여량 (mL)', font: { size: 12, weight: 'bold' } },
                        min: 0,
                        max: 27,
                        ticks: { stepSize: 3 }
                    },
                    y: {
                        title: { display: true, text: '액성 / 색상', font: { size: 12, weight: 'bold' } },
                        min: 0,
                        max: 7,
                        ticks: {
                            stepSize: 1,
                            callback: function(value) {
                                if (value === 1) return '붉은색(산)';
                                if (value === 2) return '주황색(산)';
                                if (value === 3) return '노란색(산)';
                                if (value === 4) return '초록색(중)';
                                if (value === 5) return '파란색(염)';
                                if (value === 6) return '보라색(염)';
                                return '';
                            }
                        }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
    }

    // 페이지 로드 시 초기화
    window.onload = function() {
        initTable();
        updateCharts();
    };
</script>

</body>
</html>
